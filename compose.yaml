name: telco-test-lab

services:
  stp:
    container_name: stp
    image: "telco-stp:${STP_APP_VERSION:-0.3.0}-otp29"
    build:
      context: ./stp
      dockerfile: Dockerfile
      args:
        ERLANG_IMAGE: ${ERLANG_IMAGE:-erlang:29.0.3.0-slim}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:trixie-slim}
        STP_VERSION: "${STP_APP_VERSION:-0.3.0}"
        STP_RELEASE_VERSION: "${STP_RELEASE_VERSION:-1.0}"

    # Recommended for Linux SCTP and multihoming. No ports section is used
    # because host networking exposes the host network namespace directly.
    network_mode: host

    init: true
    user: "${STP_UID:-1000}:${STP_GID:-1000}"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: "${STP_MEMORY_LIMIT:-2g}"
    cpus: "${STP_CPU_LIMIT:-2.0}"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      STP_ROOT: /lab/stp
      STP_SYSTEM_ROOT: /lab/stp/system
      STP_SEED_SYSTEM_ROOT: /opt/telco_stp/system
      STP_APP_VERSION: "${STP_APP_VERSION:-0.3.0}"
      STP_RELEASE_VERSION: "${STP_RELEASE_VERSION:-1.0}"
      STP_LIVE_EBIN: "/lab/stp/system/lib/telco_stp-${STP_APP_VERSION:-0.3.0}/ebin"
      STP_SEED_EBIN: "/opt/telco_stp/system/lib/telco_stp-${STP_APP_VERSION:-0.3.0}/ebin"
      STP_CONFIG_FILE: "/lab/stp/system/releases/${STP_RELEASE_VERSION:-1.0}/sys.config"
      STP_VM_ARGS_FILE: "/lab/stp/system/releases/${STP_RELEASE_VERSION:-1.0}/vm.args"
      STP_RELEASE_COMMAND: /lab/stp/system/bin/telco_stp
      STP_PIPE_DIR: /lab/stp/pipe
      STP_LOG_DIR: /lab/stp/logs
      STP_SYSTEM_MODE: "${STP_SYSTEM_MODE:-seed}"
      STP_EBIN_MODE: "${STP_EBIN_MODE:-seed}"
      STP_REQUIRE_SCTP: "${STP_REQUIRE_SCTP:-true}"
      STP_NODE_NAME: "${STP_NODE_NAME:-}"
      STP_COOKIE_FILE: "${STP_COOKIE_FILE:-}"
      STP_ERL_FLAGS: "${STP_ERL_FLAGS:-}"
      ERL_CRASH_DUMP: /lab/stp/crash_dumps/erl_crash.dump
      RUN_ERL_LOG_ALIVE_IN_UTC: "1"
      RUN_ERL_LOG_GENERATIONS: "${RUN_ERL_LOG_GENERATIONS:-20}"
      RUN_ERL_LOG_MAXSIZE: "${RUN_ERL_LOG_MAXSIZE:-10485760}"

    volumes:
      - type: bind
        source: ./stp/deploy/system
        target: /lab/stp/system
      - type: bind
        source: ./stp/deploy/db
        target: /lab/stp/db
      - type: bind
        source: ./stp/deploy/logs
        target: /lab/stp/logs
      - type: bind
        source: ./stp/deploy/crash_dumps
        target: /lab/stp/crash_dumps
      - type: bind
        source: ./stp/deploy/pipe
        target: /lab/stp/pipe
      # For distributed Erlang HA, create the host file with mode 0400,
      # uncomment this mount, and set STP_COOKIE_FILE in .env.
      # - type: bind
      #   source: ./stp/deploy/secrets/erlang.cookie
      #   target: /lab/stp/secrets/erlang.cookie
      #   read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
